name: Build cBioPortalData image

on:
  push:
    branches:
      - devel
    paths:
      - DESCRIPTION
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild even if an image exists for this version'
        required: false
        default: false
        type: boolean

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    name: Build image
    # only the devel branch publishes ghcr.io/waldronlab/cbioportaldata:devel
    if: github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Image name and version
        id: meta
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cbioportaldata" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^Version: *//p' DESCRIPTION)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the image is rebuilt only when the DESCRIPTION version changes
      - name: Check for existing image
        id: exists
        env:
          IMAGE: ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}
          REBUILD: ${{ inputs.rebuild || false }}
        run: |
          if [ "$REBUILD" != "true" ] && docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already exists; skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inst/docker/bioc/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.name }}:devel
            ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
